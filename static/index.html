<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutas Puebla</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/static/styles.css?v=3">
</head>
<body>
  <div class="app">

    <!-- Barra lateral -->
    <aside class="sidebar">
      <div class="logo">
        <span class="logo-icono">🚌</span>
        <h1>RUTAS<br>PUEBLA</h1>
      </div>

      <nav class="menu">
        <button type="button" class="nav-item activo" data-vista="paradas">🚏 Paradas</button>
        <button type="button" class="nav-item" data-vista="rutas">🛣️ Rutas</button>
        <button type="button" class="nav-item" data-vista="mapa">🗺️ Mapa</button>
      </nav>

      <div class="sidebar-pie">
        <span id="estado-redis" class="estado">● Verificando Redis…</span>
        <span class="bienvenida">¡Bienvenido a Rutas Puebla!</span>
        <small>Optativa Base de Datos · Producto 3</small>
      </div>
    </aside>

    <!-- Contenido -->
    <div class="contenido">
      <header class="topbar"><h2 id="titulo-vista">Paradas</h2></header>

      <!-- ========== PARADAS ========== -->
      <section id="vista-paradas" class="vista">
        <div class="panel">
          <h3 class="panel-titulo" id="titulo-formulario">Registrar parada</h3>
          <form id="form-parada">
            <input type="hidden" id="parada-id">

            <label for="nombre">Nombre de la parada</label>
            <input type="text" id="nombre" required placeholder="Ej. Parada Zócalo">

            <label for="colonia">Colonia</label>
            <input type="text" id="colonia" required placeholder="Ej. Centro">

            <div class="fila">
              <div>
                <label for="latitud">Latitud</label>
                <input type="number" id="latitud" step="any" min="-90" max="90" required placeholder="19.0431">
              </div>
              <div>
                <label for="longitud">Longitud</label>
                <input type="number" id="longitud" step="any" min="-180" max="180" required placeholder="-98.1937">
              </div>
            </div>

            <label for="select-ruta">Rutas que pasan por esta parada</label>
            <select id="select-ruta"></select>
            <div id="chips" class="chips"></div>

            <label for="activa">Estado</label>
            <select id="activa">
              <option value="true">Activa</option>
              <option value="false">Inactiva</option>
            </select>

            <div class="botones">
              <button type="submit" id="btn-guardar">Registrar parada</button>
              <button type="button" id="btn-cancelar" class="btn-gris oculto">Cancelar</button>
            </div>
          </form>
        </div>

        <div class="panel">
          <h3 class="panel-titulo">Lista de paradas</h3>
          <div class="barra-lista">
            <input type="search" id="buscador" placeholder="🔍 Buscar parada, colonia o ruta">
            <button type="button" id="btn-recargar" class="btn-morado">Actualizar lista</button>
          </div>
          <div id="lista-paradas" class="lista"></div>
        </div>
      </section>

      <!-- ========== RUTAS ========== -->
      <section id="vista-rutas" class="vista oculto">
        <div class="panel">
          <h3 class="panel-titulo" id="titulo-form-ruta">Registrar ruta</h3>
          <form id="form-ruta">
            <input type="hidden" id="ruta-id">

            <label for="ruta-nombre">Nombre de la ruta</label>
            <input type="text" id="ruta-nombre" required placeholder="Ej. Ruta 1">

            <div class="fila">
              <div>
                <label for="ruta-origen">Origen</label>
                <input type="text" id="ruta-origen" required placeholder="Ej. CAPU">
              </div>
              <div>
                <label for="ruta-destino">Destino</label>
                <input type="text" id="ruta-destino" required placeholder="Ej. Zócalo">
              </div>
            </div>

            <label for="ruta-horarios">Horarios (HH:MM separados por coma)</label>
            <input type="text" id="ruta-horarios" placeholder="06:00, 06:30, 07:00">

            <label for="ruta-activa">Estado</label>
            <select id="ruta-activa">
              <option value="true">Activa</option>
              <option value="false">Inactiva</option>
            </select>

            <div class="botones">
              <button type="submit" id="btn-guardar-ruta">Registrar ruta</button>
              <button type="button" id="btn-cancelar-ruta" class="btn-gris oculto">Cancelar</button>
            </div>
          </form>
        </div>

        <div class="panel">
          <h3 class="panel-titulo">Lista de rutas</h3>
          <div class="barra-lista">
            <button type="button" id="btn-recargar-rutas" class="btn-morado">Actualizar lista</button>
          </div>
          <div id="lista-rutas" class="lista"></div>
        </div>
      </section>

      <!-- ========== MAPA ========== -->
      <section id="vista-mapa" class="vista vista-mapa oculto">
        <div class="panel">
          <h3 class="panel-titulo">Mapa de paradas</h3>
          <div id="mapa"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- Confirmación de eliminación -->
  <div id="modal" class="modal oculto">
    <div class="modal-caja" role="dialog" aria-modal="true">
      <p id="modal-texto">¿Deseas eliminar?</p>
      <div class="botones">
        <button type="button" id="modal-no" class="btn-gris">Cancelar</button>
        <button type="button" id="modal-si" class="btn-rojo">Sí, Eliminar</button>
      </div>
    </div>
  </div>

  <!-- Mensajes -->
  <div id="toast" class="toast oculto" role="status"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/app.js?v=3"></script>
  <script src="/static/rutas.js?v=3"></script>
</body>
</html>
